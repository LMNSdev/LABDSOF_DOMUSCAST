name: "1. Testes e segurança (cada push)"

# Corre em cada push e em cada PR. Lint, análise estática e testes da API e da app,
# análise de segurança (código, dependências e segredos) e testes dos scripts da
# pipeline. Na main, quando passa, dispara o workflow 4 (versão, imagem, APK e deploy).

on:
  push:
  pull_request:

# Menor privilégio por omissão: o GITHUB_TOKEN só lê o repositório.
permissions:
  contents: read

# Cancela execuções antigas do mesmo PR/branch
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# As actions de terceiros estão fixadas ao SHA do commit (e não a tags móveis)
# para impedir que uma tag comprometida execute código novo na nossa pipeline.
# O Dependabot (.github/dependabot.yml) propõe as atualizações.
jobs:
  api:
    name: "API: lint, dependências e testes"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: DomusCast/api
    steps:
      - name: Obter o código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Instalar o Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            DomusCast/api/requirements.txt
            DomusCast/api/requirements-dev.txt
      - name: Instalar as dependências
        run: pip install -r requirements-dev.txt
      # Regras de lint e de segurança (bandit "S") definidas em ruff.toml
      - name: Lint e regras de segurança (ruff)
        run: ruff check .
      # Vulnerabilidades conhecidas nas dependências de produção
      - name: Vulnerabilidades nas dependências (pip-audit)
        run: pip-audit -r requirements.txt
      # T-08: relatório JUnit e cobertura como prova no Summary e nos artefactos do run.
      - name: Testes com cobertura (pytest)
        run: >
          pytest tests/ -v
          --junitxml=resultados/pytest.xml
          --cov=app --cov-report=term --cov-report=xml:resultados/cobertura.xml
      - name: Resumo dos testes
        if: ${{ !cancelled() }}
        run: >
          python3 ../../.github/scripts/resumo-testes.py junit "API - testes (SQLite)"
          resultados/pytest.xml resultados/cobertura.xml >> "$GITHUB_STEP_SUMMARY"
      - name: Guardar os relatórios
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: api-testes
          path: DomusCast/api/resultados/
          if-no-files-found: warn

  mobile:
    name: "App: análise e testes"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: DomusCast/mobile
    steps:
      - name: Obter o código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Instalar o Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: "3.47.x"
          channel: stable
          cache: true
      - name: Instalar as dependências da app
        run: flutter pub get
      - name: Análise estática (flutter analyze)
        run: flutter analyze
      # T-08: relatório JSON do flutter test (o output da consola não muda).
      - name: Testes de widget (flutter test)
        run: |
          mkdir -p resultados
          flutter test --file-reporter json:resultados/flutter-test.json
      - name: Resumo dos testes
        if: ${{ !cancelled() }}
        run: >
          python3 ../../.github/scripts/resumo-testes.py flutter "App - testes de widget"
          resultados/flutter-test.json >> "$GITHUB_STEP_SUMMARY"
      - name: Guardar os relatórios
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: mobile-testes
          path: DomusCast/mobile/resultados/
          if-no-files-found: warn

  sast:
    name: "Segurança: análise do código (Semgrep)"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Obter o código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Instalar o Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Instalar o Semgrep
        run: pip install semgrep==1.181.0
      # Regras da comunidade para Python (FastAPI/SQLAlchemy) e Dockerfile; falha em qualquer achado
      - name: Analisar o código da API (Semgrep)
        run: >
          semgrep scan --config p/python --config p/dockerfile
          --error --metrics=off --exclude tests DomusCast/api

  sca-dart:
    name: "Segurança: dependências da app (OSV)"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Obter o código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Binário fixado por versão e validado por SHA-256 (o pip-audit cobre o Python)
      - name: Instalar o osv-scanner
        run: |
          curl -sSfL -o osv-scanner https://github.com/google/osv-scanner/releases/download/v2.7.0/osv-scanner_linux_amd64
          echo "160c6253e2922e9e0a6a9771c5c4c40a4b3c6090b34a3cdd5e80c96cc2e4218b  osv-scanner" | sha256sum -c -
          chmod +x osv-scanner
      - name: Vulnerabilidades nas dependências da app
        run: ./osv-scanner scan source -L DomusCast/mobile/pubspec.lock

  secrets:
    name: "Segurança: segredos no histórico (gitleaks)"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Obter o código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Procurar segredos (gitleaks)
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

  pipeline:
    name: "Pipeline: testes dos scripts"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Obter o código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # os testes usam tags reais da main
          persist-credentials: false
      - name: Testes dos scripts de versão, deploy, regras e resumo
        run: bash .github/scripts/tests.sh
