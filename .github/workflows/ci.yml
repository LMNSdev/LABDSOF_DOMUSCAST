name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  api:
    name: API — lint + tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: DomusCast/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: DomusCast/api/requirements.txt
      - run: pip install -r requirements.txt
      - run: ruff check .
      - run: pytest tests/ -v

  mobile:
    name: Mobile — analyze + tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: DomusCast/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.x"
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
