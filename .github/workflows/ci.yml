name: CI

on:
  push:
  pull_request:

# Menor privilégio por omissão: o GITHUB_TOKEN só lê o repositório.
permissions:
  contents: read

# Cancela execuções antigas do mesmo PR/branch
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# As actions de terceiros estão fixadas ao SHA do commit (e não a tags móveis)
# para impedir que uma tag comprometida execute código novo na nossa pipeline.
# O Dependabot (.github/dependabot.yml) propõe as atualizações.
jobs:
  api:
    name: API - lint + security + tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: DomusCast/api
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            DomusCast/api/requirements.txt
            DomusCast/api/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      # Lint + regras de segurança (bandit "S") definidas em ruff.toml
      - run: ruff check .
      # Vulnerabilidades conhecidas nas dependências de produção
      - run: pip-audit -r requirements.txt
      - run: pytest tests/ -v

  mobile:
    name: Mobile - analyze + tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: DomusCast/mobile
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: "3.24.x"
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  sast:
    name: SAST - Semgrep
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install semgrep==1.181.0
      # Regras da comunidade para Python (FastAPI/SQLAlchemy) e Dockerfile; falha em qualquer achado
      - run: >
          semgrep scan --config p/python --config p/dockerfile
          --error --metrics=off --exclude tests DomusCast/api

  sca-dart:
    name: SCA - Dart (OSV)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      # Binário fixado por versão e validado por SHA-256 (o pip-audit cobre o Python)
      - name: Install osv-scanner
        run: |
          curl -sSfL -o osv-scanner https://github.com/google/osv-scanner/releases/download/v2.7.0/osv-scanner_linux_amd64
          echo "160c6253e2922e9e0a6a9771c5c4c40a4b3c6090b34a3cdd5e80c96cc2e4218b  osv-scanner" | sha256sum -c -
          chmod +x osv-scanner
      - run: ./osv-scanner scan source -L DomusCast/mobile/pubspec.lock

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
