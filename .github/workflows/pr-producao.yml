name: "3. PR: pronto para produção"

# Verificações antes de entrar na main. Cada merge na main cria uma versão e faz
# o deploy (release.yml), por isso aqui verifica-se o que só falharia depois:
# migrações em PostgreSQL, a imagem Docker a arrancar, as vulnerabilidades da
# imagem, o compose de produção com o Caddyfile e o build do APK.
#
# Num PR que só muda docs/ (ex.: a daily) estes jobs são ignorados, tal como o
# release.yml não cria versão nesse caso. Usa-se "if" nos jobs, e não "paths" no
# trigger, porque são verificações obrigatórias: um job ignorado conta como
# aprovado, mas um workflow que não corre deixa o PR à espera.
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pr-producao-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  alteracoes:
    name: "Triagem: o PR só muda docs/?"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      docs: ${{ steps.docs.outputs.docs }}
    steps:
      # O checkout de um PR é o commit de merge; o primeiro pai é a main.
      - name: Obter o código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Ver se o PR só muda docs/
        id: docs
        run: |
          set -euo pipefail
          docs=$(bash .github/scripts/docs-only.sh HEAD^1 HEAD)
          echo "docs=$docs" >> "$GITHUB_OUTPUT"
          if [ "$docs" = true ]; then
            echo "### Só mudou docs/: verificações de produção ignoradas" >> "$GITHUB_STEP_SUMMARY"
          fi

  # Os jobs seguintes correm sempre que o PR não é só de docs/. Se o job
  # "alteracoes" falhar, o output fica vazio e os jobs correm na mesma.
  postgres:
    name: "API: migrações e testes em PostgreSQL"
    needs: alteracoes
    if: ${{ !cancelled() && needs.alteracoes.outputs.docs != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16@sha256:dd2bf3ce2dc83a81674cf7f217fcfd8a5009a4b325dda5b843bfee82a06cff6f
        env:
          POSTGRES_USER: condoapp
          POSTGRES_PASSWORD: condoapp
          POSTGRES_DB: condoapp
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U condoapp"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: DomusCast/api
    env:
      PGHOST: localhost
      PGUSER: condoapp
      PGPASSWORD: condoapp
    steps:
      - name: Obter o código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Instalar o Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            DomusCast/api/requirements.txt
            DomusCast/api/requirements-dev.txt
      - name: Instalar as dependências
        run: pip install -r requirements-dev.txt

      # O downgrade garante que cada migração pode ser revertida num rollback.
      - name: Migrações (upgrade, downgrade e upgrade)
        env:
          DATABASE_URL: postgresql://condoapp:condoapp@localhost:5432/condoapp
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head

      # Os testes do CI normal correm em SQLite; aqui correm no motor de produção.
      - name: Testes em PostgreSQL (pytest)
        env:
          TEST_DATABASE_URL: postgresql://condoapp:condoapp@localhost:5432/ci_testes
        run: |
          psql -d condoapp -c "CREATE DATABASE ci_testes"
          pytest tests/ -v --junitxml=resultados/pytest-postgres.xml

      # T-08: prova dos testes em PostgreSQL no Summary e nos artefactos do run.
      - name: Resumo dos testes
        if: ${{ !cancelled() }}
        run: >
          python3 ../../.github/scripts/resumo-testes.py junit "API - testes em PostgreSQL"
          resultados/pytest-postgres.xml >> "$GITHUB_STEP_SUMMARY"
      - name: Guardar os relatórios
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: api-testes-postgres
          path: DomusCast/api/resultados/
          if-no-files-found: warn

  docker:
    name: "Docker: arranque, testes end-to-end e Trivy"
    needs: alteracoes
    if: ${{ !cancelled() && needs.alteracoes.outputs.docs != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Obter o código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Mesmo Dockerfile da imagem publicada no GHCR; o entrypoint corre as migrações.
      # WORKER_BACKOFF_UNIDADE_S=1: as novas tentativas do calendário demoram segundos e não
      # minutos, para os testes end-to-end da condição de falha caberem no job (T-06).
      - name: Arrancar a stack (docker compose up)
        working-directory: DomusCast
        env:
          WORKER_BACKOFF_UNIDADE_S: "1"
        run: docker compose up --build -d

      - name: Esperar pela API (/health com a base de dados)
        run: |
          for _ in $(seq 1 30); do
            if curl -fsS http://localhost:8000/health | grep -q '"db":"ok"'; then
              echo "API pronta."
              exit 0
            fi
            sleep 2
          done
          docker compose -f DomusCast/docker-compose.yml logs api
          exit 1

      # T-06: jornada principal de ponta a ponta contra os containers (API, worker-calendario,
      # simulador e PostgreSQL), só por HTTP.
      - name: Instalar o Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: DomusCast/api/requirements-dev.txt

      - name: Instalar as dependências dos testes
        working-directory: DomusCast/api
        run: pip install -r requirements-dev.txt

      - name: Testes end-to-end (pytest)
        working-directory: DomusCast/api
        env:
          E2E_API_URL: http://localhost:8000
          E2E_CALENDARIO_URL: http://localhost:8001
        run: pytest tests_e2e/ -v --junitxml=resultados/pytest-e2e.xml

      # T-08: prova dos testes end-to-end no Summary e nos artefactos do run.
      - name: Resumo dos testes
        if: ${{ !cancelled() }}
        working-directory: DomusCast/api
        run: >
          python3 ../../.github/scripts/resumo-testes.py junit "API - testes end-to-end"
          resultados/pytest-e2e.xml >> "$GITHUB_STEP_SUMMARY"

      # Se algo falhou, os logs dos containers ficam no log do passo e num ficheiro do artefacto.
      - name: Logs dos containers (só se algo falhou)
        if: failure()
        working-directory: DomusCast
        run: |
          mkdir -p api/resultados
          docker compose logs --no-color api worker-calendario calendario | tee api/resultados/logs-containers.txt

      - name: Guardar os relatórios
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: api-testes-e2e
          path: DomusCast/api/resultados/
          if-no-files-found: warn

      # Falha em vulnerabilidades HIGH ou CRITICAL que já têm correção.
      # Imagem do Trivy fixada por digest (v0.76.2).
      - name: Vulnerabilidades na imagem da API (Trivy)
        run: >
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock
          aquasec/trivy@sha256:8f6bb947dbc528902e11f2f5be52f7b519f6a39d5d148f41166f2040499768fb
          image --scanners vuln --ignore-unfixed --severity CRITICAL,HIGH --exit-code 1
          domuscast-api

      - name: Parar a stack (docker compose down)
        if: always()
        working-directory: DomusCast
        run: docker compose down -v

  deploy:
    name: "Produção: compose e Caddyfile válidos"
    needs: alteracoes
    if: ${{ !cancelled() && needs.alteracoes.outputs.docs != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: DomusCast/deploy
    # Valores fictícios: só servem para o compose resolver as variáveis obrigatórias.
    env:
      IMAGE_TAG: v0.0.0
      POSTGRES_PASSWORD: ci-validacao
    steps:
      - name: Obter o código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validar o docker-compose.prod.yml
        run: docker compose -f docker-compose.prod.yml config --quiet

      # Mesma imagem do Caddy que corre na VM, lida do compose de produção.
      - name: Validar o Caddyfile (caddy validate)
        run: |
          set -euo pipefail
          caddy=$(docker compose -f docker-compose.prod.yml config --images | grep '^caddy:')
          docker run --rm -e DOMAIN=domuscast.example \
            -v "$PWD/Caddyfile:/etc/caddy/Caddyfile:ro" "$caddy" \
            caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile

  apk:
    name: "App: build do APK"
    needs: alteracoes
    if: ${{ !cancelled() && needs.alteracoes.outputs.docs != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: DomusCast/mobile
    steps:
      - name: Obter o código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Instalar o Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: "3.47.x"
          channel: stable
          cache: true
      - name: Instalar as dependências da app
        run: flutter pub get

      # Mesmo comando do release.yml, para um erro no Gradle ou no AndroidManifest
      # aparecer no PR e não depois do merge.
      - name: Build do APK
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
        run: |
          set -euo pipefail
          export JAVA_HOME="$JAVA_HOME_17_X64"
          flutter build apk --release --dart-define=API_BASE_URL="https://${DEPLOY_HOST:-localhost}"
