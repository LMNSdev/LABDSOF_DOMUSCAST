name: PR - produção

# Verificações antes de entrar na main. Cada merge na main cria uma versão e faz
# o deploy (release.yml), por isso aqui verifica-se o que só falharia depois:
# migrações em PostgreSQL, a imagem Docker a arrancar, as vulnerabilidades da
# imagem, o compose de produção com o Caddyfile e o build do APK.
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pr-producao-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  postgres:
    name: API - migrações e testes em PostgreSQL
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16@sha256:dd2bf3ce2dc83a81674cf7f217fcfd8a5009a4b325dda5b843bfee82a06cff6f
        env:
          POSTGRES_USER: condoapp
          POSTGRES_PASSWORD: condoapp
          POSTGRES_DB: condoapp
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U condoapp"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: DomusCast/api
    env:
      PGHOST: localhost
      PGUSER: condoapp
      PGPASSWORD: condoapp
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            DomusCast/api/requirements.txt
            DomusCast/api/requirements-dev.txt
      - run: pip install -r requirements-dev.txt

      # O downgrade garante que cada migração pode ser revertida num rollback.
      - name: Migrações (upgrade, downgrade e upgrade)
        env:
          DATABASE_URL: postgresql://condoapp:condoapp@localhost:5432/condoapp
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head

      # Os testes do CI normal correm em SQLite; aqui correm no motor de produção.
      - name: Testes em PostgreSQL
        env:
          TEST_DATABASE_URL: postgresql://condoapp:condoapp@localhost:5432/ci_testes
        run: |
          psql -d condoapp -c "CREATE DATABASE ci_testes"
          pytest tests/ -v

  docker:
    name: Docker - arranque, /health e Trivy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Mesmo Dockerfile da imagem publicada no GHCR; o entrypoint corre as migrações.
      - name: docker compose up
        working-directory: DomusCast
        run: docker compose up --build -d

      - name: /health responde com a base de dados ligada
        run: |
          for _ in $(seq 1 30); do
            if curl -fsS http://localhost:8000/health | grep -q '"db":"ok"'; then
              echo "API pronta."
              exit 0
            fi
            sleep 2
          done
          docker compose -f DomusCast/docker-compose.yml logs api
          exit 1

      # Falha em vulnerabilidades HIGH ou CRITICAL que já têm correção.
      # Imagem do Trivy fixada por digest (v0.76.2).
      - name: Trivy na imagem da API
        run: >
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock
          aquasec/trivy@sha256:8f6bb947dbc528902e11f2f5be52f7b519f6a39d5d148f41166f2040499768fb
          image --scanners vuln --ignore-unfixed --severity CRITICAL,HIGH --exit-code 1
          domuscast-api

      - name: docker compose down
        if: always()
        working-directory: DomusCast
        run: docker compose down -v

  deploy:
    name: Deploy - compose de produção e Caddyfile
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: DomusCast/deploy
    # Valores fictícios: só servem para o compose resolver as variáveis obrigatórias.
    env:
      IMAGE_TAG: v0.0.0
      POSTGRES_PASSWORD: ci-validacao
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Sintaxe do docker-compose.prod.yml
        run: docker compose -f docker-compose.prod.yml config --quiet

      # Mesma imagem do Caddy que corre na VM, lida do compose de produção.
      - name: Caddyfile
        run: |
          set -euo pipefail
          caddy=$(docker compose -f docker-compose.prod.yml config --images | grep '^caddy:')
          docker run --rm -e DOMAIN=domuscast.example \
            -v "$PWD/Caddyfile:/etc/caddy/Caddyfile:ro" "$caddy" \
            caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile

  apk:
    name: Mobile - build do APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: DomusCast/mobile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: "3.47.x"
          channel: stable
          cache: true
      - run: flutter pub get

      # Mesmo comando do release.yml, para um erro no Gradle ou no AndroidManifest
      # aparecer no PR e não depois do merge.
      - name: Build do APK
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
        run: |
          set -euo pipefail
          export JAVA_HOME="$JAVA_HOME_17_X64"
          flutter build apk --release --dart-define=API_BASE_URL="https://${DEPLOY_HOST:-localhost}"
