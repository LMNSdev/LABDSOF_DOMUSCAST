version: 2
updates:
  - package-ecosystem: pip
    directory: /DomusCast/api
    schedule:
      interval: weekly
    groups:
      python-dependencies:
        patterns: ["*"]

  - package-ecosystem: pub
    directory: /DomusCast/mobile
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: /DomusCast/api
    schedule:
      interval: weekly

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
