services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: condoapp
      POSTGRES_PASSWORD: condoapp
      POSTGRES_DB: condoapp
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U condoapp"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./api
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://condoapp:condoapp@postgres:5432/condoapp
      MEDIA_ROOT: /app/media
    volumes:
      - reportes_media:/app/media
    depends_on:
      postgres:
        condition: service_healthy

  # US-28: publica as reuniões no calendário externo (jobs publicar_calendario).
  # Mesma imagem da API, outro comando; as migrações correm no arranque da API.
  # Processo próprio para uma transcrição longa (worker da US-10) não o atrasar.
  worker-calendario:
    build: ./api
    command: ["python", "-m", "app.worker.calendario"]
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://condoapp:condoapp@postgres:5432/condoapp
      CALENDARIO_URL: http://calendario:8001
      # 60 = esperas de 1, 2, 4 e 8 minutos; 1 = segundos, só para demonstrações.
      WORKER_BACKOFF_UNIDADE_S: ${WORKER_BACKOFF_UNIDADE_S:-60}
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_started
      calendario:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8082/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12

  # Simulador do serviço de calendário externo (8.6). Falhas com POST /_chaos.
  calendario:
    build: ./api
    command: ["uvicorn", "simulador.main:app", "--host", "0.0.0.0", "--port", "8001"]
    ports:
      - "127.0.0.1:8001:8001"

volumes:
  pgdata:
  reportes_media:
