services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: condoapp
      POSTGRES_PASSWORD: condoapp
      POSTGRES_DB: condoapp
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U condoapp"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./api
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://condoapp:condoapp@postgres:5432/condoapp
      MEDIA_ROOT: /app/media
    volumes:
      - reportes_media:/app/media
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12

  worker:
    build: ./api
    command: ["python", "-m", "app.worker.main"]
    environment:
      DATABASE_URL: postgresql://condoapp:condoapp@postgres:5432/condoapp
      MEDIA_ROOT: /app/media
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    volumes:
      - reportes_media:/app/media
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8081/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  pgdata:
  reportes_media:
