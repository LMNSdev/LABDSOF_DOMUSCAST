services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: condoapp
      POSTGRES_PASSWORD: condoapp
      POSTGRES_DB: condoapp
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U condoapp"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./api
    environment:
      DATABASE_URL: postgresql://condoapp:condoapp@postgres:5432/condoapp
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
