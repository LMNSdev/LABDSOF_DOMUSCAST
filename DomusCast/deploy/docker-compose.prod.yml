# Stack de produção na VM (Azure). Copiado pela pipeline para /opt/domuscast
# e arrancado por deploy.sh. Ver docs/sprintB/VM/README.md.
#
# Só o Caddy está exposto (80/443); a API e o PostgreSQL ficam na rede interna.
# Variáveis: IMAGE_TAG (vX.Y.Z, passada pelo deploy.sh) e POSTGRES_PASSWORD
# (no .env da VM, criado no primeiro deploy e nunca versionado).
name: domuscast

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: condoapp
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
      POSTGRES_DB: condoapp
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U condoapp"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  api:
    image: ghcr.io/lmnsdev/domuscast-api:${IMAGE_TAG:?defina IMAGE_TAG (vX.Y.Z)}
    environment:
      DATABASE_URL: postgresql://condoapp:${POSTGRES_PASSWORD}@postgres:5432/condoapp
      # A API está atrás do Caddy: sem isto, request.client.host seria o IP do Caddy
      # e os limites por IP (US-01, US-15) contariam para todos os utilizadores juntos.
      # Confiar no X-Forwarded-For é seguro porque a API não tem portas publicadas
      # (só o Caddy lhe chega) e o Caddy substitui o cabeçalho enviado pelo cliente.
      FORWARDED_ALLOW_IPS: "*"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # US-28: Worker do calendário e simulador, com a mesma imagem da API e outro
  # comando. Nenhum tem portas publicadas; as falhas do simulador mudam-se com
  # `docker compose exec calendario` (ver DomusCast/README.md).
  worker-calendario:
    image: ghcr.io/lmnsdev/domuscast-api:${IMAGE_TAG:?defina IMAGE_TAG (vX.Y.Z)}
    command: ["python", "-m", "app.worker.calendario"]
    environment:
      DATABASE_URL: postgresql://condoapp:${POSTGRES_PASSWORD}@postgres:5432/condoapp
      CALENDARIO_URL: http://calendario:8001
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_started
      calendario:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8082/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  calendario:
    image: ghcr.io/lmnsdev/domuscast-api:${IMAGE_TAG:?defina IMAGE_TAG (vX.Y.Z)}
    command: ["uvicorn", "simulador.main:app", "--host", "0.0.0.0", "--port", "8001"]
    restart: unless-stopped

  caddy:
    image: caddy:2.11.9
    environment:
      DOMAIN: domuscast.belgiumcentral.cloudapp.azure.com
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
    restart: unless-stopped

volumes:
  pgdata:
  caddy_data:
  caddy_config:
